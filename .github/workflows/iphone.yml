name: iPhone TestFlight

# Builds main for the App Store in the cloud with EAS and uploads it to TestFlight. Run it by hand from
# the Actions tab. It needs the EXPO_TOKEN secret and the EAS project ID in app.json, both set up after
# the first build from a computer; see docs/iphone-testflight.md.
on:
  workflow_dispatch:

concurrency:
  group: iphone-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check the setup
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN secret first (docs/iphone-testflight.md, Later builds)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Check the EAS project ID
        run: |
          if ! node -e "process.exit(require('./app.json').expo.extra?.eas?.projectId ? 0 : 1)"; then
            echo "::error::app.json has no extra.eas.projectId yet. Do the first build from a computer (docs/iphone-testflight.md)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --no-wait: the build and upload carry on at EAS, so this job ends in about a minute and its
      # log links to the build on expo.dev.
      - run: npx eas-cli@latest build --platform ios --profile production --non-interactive --auto-submit --no-wait
