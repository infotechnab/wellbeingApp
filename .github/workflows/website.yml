name: Website

# Publishes the app's home page and the web app to GitHub Pages (https://<owner>.github.io/<repo>/) on
# every push to main.
# Needs Settings > Pages > Source set to "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The site lives under /<repo>/: the home page at the top and the web app in app/. With a custom
      # domain it moves to the root: make WEB_BASE_URL just /app then.
      - run: npm run export:web -- --output-dir dist/app
        env:
          WEB_BASE_URL: /${{ github.event.repository.name }}/app
      - run: node site/build.js dist
      # Pages has no rewrites: a link to app/help or a reload there gets 404.html, so make that the app too.
      - run: cp dist/app/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
